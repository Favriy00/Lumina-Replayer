name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Preparar proyecto
        run: |
          mkdir app && cd app
          flutter create --org com.lumina --project-name lumina_replayer .
          unzip -o ../lumina-replayer-archivos.zip -d .
          flutter pub get
          for f in $(find ~/.pub-cache -path "*on_audio_query_android*/android/build.gradle"); do
            grep -q "namespace" "$f" || sed -i "/^android {/a\    namespace 'com.lucasjosino.on_audio_query'" "$f"
          done
      - name: Compilar
        run: cd app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-replayer-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
